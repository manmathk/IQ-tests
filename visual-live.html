<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IQ LIVE — Visual + History Comment Quiz</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#050505}body{overflow:hidden}.stage{width:100vw;height:100vh;display:grid;place-items:center;background:#fff}.page{width:min(100vw,56.25vh);height:100vh;max-height:177.78vw;position:relative;overflow:hidden;background:#fff}.top{height:11%;display:flex;align-items:center;justify-content:center;position:relative}.test{font-size:clamp(18px,4vw,42px);font-weight:900;letter-spacing:.03em}.live{position:absolute;right:4%;top:24%;font-size:clamp(11px,2.4vw,23px);font-weight:900;color:#fff;background:#e51d2a;padding:.35em .7em;border-radius:999px}.live:before{content:'';display:inline-block;width:.5em;height:.5em;background:#fff;border-radius:50%;margin-right:.35em}.headline{height:15%;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 5%}.headline h1{margin:0;font-size:clamp(23px,6.4vw,66px);line-height:.98;font-weight:1000}.category{position:absolute;left:5%;top:2%;font-size:clamp(9px,2vw,18px);font-weight:900;color:#777;text-transform:uppercase;letter-spacing:.09em}.comment{position:absolute;left:5%;right:5%;bottom:3.2%;text-align:center;background:#111;color:#fff;border-radius:999px;padding:1.2% 2%;font-size:clamp(11px,2.5vw,25px);font-weight:900;letter-spacing:.02em}.board{height:70%;margin:0 4%;display:flex;flex-direction:column;justify-content:center}.prompt{font-size:clamp(28px,8.4vw,86px);line-height:1.02;font-weight:1000;text-align:center;padding:0 2%}.detail{font-size:clamp(16px,3.6vw,34px);line-height:1.15;font-weight:800;text-align:center;margin:3% 4% 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:2.5%;margin:5% 2% 0}.choice{border:4px solid #111;border-radius:18px;background:#fff;min-height:8.8vh;padding:2% 3%;font-size:clamp(18px,5vw,52px);font-weight:1000;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.02;gap:.22em}.choice span{font-size:.52em;flex:0 0 auto}.choice.correct{background:#111;color:#fff}.choice.wrong{opacity:.28}.reveal{position:absolute;inset:0;background:rgba(255,255,255,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8%;opacity:0;pointer-events:none;transition:opacity .3s}.reveal.show{opacity:1}.reveal .small{font-size:clamp(13px,3vw,30px);font-weight:900;letter-spacing:.12em}.reveal .answer{font-size:clamp(40px,12vw,115px);line-height:1.02;font-weight:1000;margin:3% 0}.reveal .why{font-size:clamp(14px,3.4vw,34px);font-weight:800;max-width:91%;line-height:1.18}.reveal .next{margin-top:5%;font-size:clamp(12px,2.5vw,25px);font-weight:900}.controls{position:absolute;left:3%;top:2%;display:flex;gap:6px;z-index:10}.ctrl{border:2px solid #111;background:#fff;border-radius:10px;padding:5px 8px;font-weight:900;font-size:11px;cursor:pointer}.progress{position:absolute;left:0;right:0;bottom:0;height:5px;background:#eee}.progress i{display:block;height:100%;width:0;background:#111}.mode{position:absolute;left:3%;bottom:1.2%;font-size:9px;font-weight:900;color:#777}@media(min-width:800px){.page{border-left:1px solid #ddd;border-right:1px solid #ddd}.controls{display:flex}}@media(max-width:500px){.controls{display:none}.headline{height:14%}.board{height:71%}.choice{border-width:3px;border-radius:13px}.choices{margin-top:4%}}
</style>
</head>
<body>
<div class="stage"><main class="page" id="page">
<div class="controls"><button class="ctrl" id="prev">←</button><button class="ctrl" id="nextBtn">NEXT →</button><button class="ctrl" id="fs">FULLSCREEN</button></div>
<div class="category" id="category">VISUAL IQ</div>
<header class="top"><div class="test" id="test">TEST 1</div><div class="live">LIVE</div></header>
<section class="headline"><h1 id="title">CAN YOU SOLVE THIS?</h1></section>
<section class="board"><div class="prompt" id="prompt"></div><div class="detail" id="detail"></div><div class="choices" id="choices"></div></section>
<div class="comment">💬 COMMENT A, B, C OR D</div>
<div class="mode">SPACE / ENTER = NEXT • R = REVEAL • ← / → = CHANGE</div>
<div class="progress"><i id="progress"></i></div>
<div class="reveal" id="reveal"><div class="small">CORRECT ANSWER</div><div class="answer" id="answer"></div><div class="why" id="why"></div><div class="next">NEXT QUESTION COMING...</div></div>
</main></div>
<script>
'use strict';
const PUZZLE_TIME=90000;
const REVEAL_TIME=5000;
const puzzles=[
 {cat:'VISUAL IQ',title:'SPOT THE ODD ONE',prompt:'▲ ▲ ▲ ▲ ▲ ▲ ▲ ▲\n▲ ▲ ▲ △ ▲ ▲ ▲ ▲',detail:'Which symbol is different?',answer:'C',options:['A • 1st row, 4th','B • 2nd row, 3rd','C • 2nd row, 4th','D • 2nd row, 5th'],why:'The only hollow triangle is the 4th symbol in the second row.'},
 {cat:'LOGIC IQ',title:'WHAT COMES NEXT?',prompt:'2  •  6  •  12  •  20  •  ?',detail:'Look for the pattern.',answer:'B',options:['A • 28','B • 30','C • 32','D • 34'],why:'The gaps are +4, +6, +8, so the next gap is +10. 20 + 10 = 30.'},
 {cat:'VISUAL IQ',title:'WHICH IS THE MIRROR?',prompt:'↗   ↘   ↙   ↖',detail:'Which option is the mirror image of ↗?',answer:'D',options:['A • ↗','B • ↘','C • ↙','D • ↖'],why:'A mirror flip across a vertical axis changes ↗ into ↖.'},
 {cat:'WORD IQ',title:'FIND THE MISSING LETTER',prompt:'A • C • F • J • O • ?',detail:'Each jump gets one letter larger.',answer:'A',options:['A • U','B • T','C • V','D • W'],why:'The jumps are +2, +3, +4, +5, so the next is +6: O → U.'},
 {cat:'MATH IQ',title:'CAN YOU CRACK IT?',prompt:'🟦 + 🟦 + 🔺 = 17\n🟦 + 🔺 = 10',detail:'🟦 × 🔺 = ?',answer:'B',options:['A • 18','B • 21','C • 24','D • 28'],why:'Subtracting gives 🟦 = 7 and 🔺 = 3. So 7 × 3 = 21.'},
 {cat:'HISTORY IQ',title:'ANCIENT WORLD',prompt:'Which civilization built Machu Picchu?',detail:'A famous citadel high in the Andes.',answer:'C',options:['A • Maya','B • Aztec','C • Inca','D • Roman'],why:'Machu Picchu was built by the Inca civilization in present-day Peru.'},
 {cat:'HISTORY IQ',title:'TURNING POINT',prompt:'Who was the first person to walk on the Moon?',detail:'Apollo 11, July 1969.',answer:'A',options:['A • Neil Armstrong','B • Buzz Aldrin','C • Yuri Gagarin','D • Michael Collins'],why:'Neil Armstrong stepped onto the lunar surface first on July 20, 1969.'},
 {cat:'HISTORY IQ',title:'EMPIRE OF ROME',prompt:'Which city was buried by Mount Vesuvius in AD 79?',detail:'Think of the famous archaeological ruins.',answer:'D',options:['A • Athens','B • Alexandria','C • Carthage','D • Pompeii'],why:'Pompeii was buried by the AD 79 eruption of Mount Vesuvius.'},
 {cat:'HISTORY IQ',title:'ANCIENT EGYPT',prompt:'What writing system used picture symbols in ancient Egypt?',detail:'The symbols appear on temples and monuments.',answer:'B',options:['A • Cuneiform','B • Hieroglyphics','C • Sanskrit','D • Linear B'],why:'Egyptian hieroglyphs used pictorial signs and were used for monumental and religious writing.'},
 {cat:'HISTORY IQ',title:'WORLD WAR II',prompt:'Which event happened first?',detail:'Put these in historical order.',answer:'C',options:['A • D-Day','B • Pearl Harbor','C • Battle of Britain','D • VE Day'],why:'The Battle of Britain was fought in 1940; Pearl Harbor was 1941, D-Day 1944, and VE Day 1945.'},
 {cat:'HISTORY IQ',title:'AGE OF DISCOVERY',prompt:'Which explorer reached the Americas in 1492?',detail:'His voyage sailed west across the Atlantic.',answer:'A',options:['A • Christopher Columbus','B • Ferdinand Magellan','C • James Cook','D • Marco Polo'],why:'Christopher Columbus reached the Caribbean in 1492 during his first transatlantic voyage.'},
 {cat:'HISTORY IQ',title:'INDIAN HISTORY',prompt:'Who wrote the Arthashastra?',detail:'An ancient Indian text on statecraft and economics.',answer:'B',options:['A • Kalidasa','B • Kautilya','C • Ashoka','D • Panini'],why:'The Arthashastra is traditionally attributed to Kautilya, also known as Chanakya.'},
 {cat:'HISTORY IQ',title:'INDIAN HISTORY',prompt:'The Taj Mahal was commissioned by which Mughal emperor?',detail:'It was built in Agra as a mausoleum.',answer:'D',options:['A • Akbar','B • Babur','C • Aurangzeb','D • Shah Jahan'],why:'Shah Jahan commissioned the Taj Mahal in memory of Mumtaz Mahal.'},
 {cat:'HISTORY IQ',title:'ANCIENT INDIA',prompt:'Which empire was ruled by Emperor Ashoka?',detail:'Its capital was Pataliputra.',answer:'A',options:['A • Maurya','B • Gupta','C • Chola','D • Kushan'],why:'Ashoka was the Mauryan emperor whose reign followed the Kalinga War.'},
 {cat:'HISTORY IQ',title:'ANCIENT CIVILIZATION',prompt:'Which site belongs to the Indus Valley Civilization?',detail:'Choose the archaeological city.',answer:'C',options:['A • Taxila','B • Nalanda','C • Mohenjo-daro','D • Hampi'],why:'Mohenjo-daro was a major urban center of the Indus Valley Civilization.'},
 {cat:'HISTORY IQ',title:'MEDIEVAL HISTORY',prompt:'The Magna Carta was sealed in which year?',detail:'A landmark in English constitutional history.',answer:'B',options:['A • 1066','B • 1215','C • 1492','D • 1688'],why:'King John sealed the Magna Carta at Runnymede in 1215.'},
 {cat:'HISTORY IQ',title:'REVOLUTIONARY HISTORY',prompt:'The French Revolution began in which year?',detail:'Think of the storming of the Bastille.',answer:'A',options:['A • 1789','B • 1776','C • 1815','D • 1848'],why:'The French Revolution began in 1789, with the Bastille stormed on July 14.'},
 {cat:'HISTORY IQ',title:'SPACE HISTORY',prompt:'Who was the first human in space?',detail:'Vostok 1, April 1961.',answer:'D',options:['A • Alan Shepard','B • John Glenn','C • Neil Armstrong','D • Yuri Gagarin'],why:'Soviet cosmonaut Yuri Gagarin became the first human in space on April 12, 1961.'},
 {cat:'HISTORY IQ',title:'WORLD HISTORY',prompt:'Which ancient people developed cuneiform writing?',detail:'One of the earliest known writing systems.',answer:'C',options:['A • Vikings','B • Romans','C • Sumerians','D • Aztecs'],why:'The Sumerians of ancient Mesopotamia developed cuneiform in the late 4th millennium BCE.'},
 {cat:'VISUAL IQ',title:'COUNT THE SHAPES',prompt:'🔵 🔵 🔺 🔵 🔺 🔵 🔵 🔺',detail:'How many triangles are there?',answer:'A',options:['A • 3','B • 2','C • 4','D • 5'],why:'There are exactly three triangles in the sequence.'},
 {cat:'LOGIC IQ',title:'SEQUENCE TRAP',prompt:'1 • 4 • 9 • 16 • 25 • ?',detail:'What number belongs next?',answer:'D',options:['A • 30','B • 32','C • 35','D • 36'],why:'These are perfect squares: 1², 2², 3², 4², 5², so the next is 6² = 36.'},
 {cat:'HISTORY IQ',title:'COLD WAR HISTORY',prompt:'The Berlin Wall fell in which year?',detail:'A symbolic end of the Cold War era in Europe.',answer:'C',options:['A • 1979','B • 1985','C • 1989','D • 1991'],why:'The Berlin Wall opened on November 9, 1989.'},
 {cat:'HISTORY IQ',title:'INDIAN INDEPENDENCE',prompt:'India became independent from British rule in which year?',detail:'The date celebrated as Independence Day.',answer:'B',options:['A • 1942','B • 1947','C • 1950','D • 1952'],why:'India became independent on August 15, 1947; the Constitution came into force in 1950.'}
];
let index=0,revealed=false,auto;
const $=id=>document.getElementById(id);
function render(){
 const p=puzzles[index]; revealed=false; $('reveal').classList.remove('show'); $('test').textContent='TEST '+(index+1); $('category').textContent=p.cat; $('title').textContent=p.title; $('prompt').innerHTML=p.prompt.replace(/\n/g,'<br>'); $('detail').textContent=p.detail;
 $('choices').innerHTML=p.options.map((v,i)=>`<div class="choice" data-value="${p.answer}"><span>${'ABCD'[i]}</span>${v.replace(/^([A-D]) • /,'')}</div>`).join('');
 document.querySelectorAll('.choice').forEach((el,i)=>el.dataset.letter='ABCD'[i]);
 $('progress').style.transition='none'; $('progress').style.width='0%';
 requestAnimationFrame(()=>{$('progress').style.transition=`width ${PUZZLE_TIME/1000}s linear`; $('progress').style.width='100%'});
 clearTimeout(auto); auto=setTimeout(reveal,PUZZLE_TIME);
}
function reveal(){if(revealed)return; revealed=true; const p=puzzles[index]; document.querySelectorAll('.choice').forEach(x=>{x.classList.toggle('correct',x.dataset.letter===p.answer);x.classList.toggle('wrong',x.dataset.letter!==p.answer)}); $('answer').textContent=p.answer; $('why').textContent=p.why; $('reveal').classList.add('show'); clearTimeout(auto); auto=setTimeout(next,REVEAL_TIME)}
function next(){index=(index+1)%puzzles.length;render()}
function prev(){index=(index-1+puzzles.length)%puzzles.length;render()}
$('nextBtn').onclick=next; $('prev').onclick=prev; $('fs').onclick=()=>document.documentElement.requestFullscreen?.();
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();next()}if(e.key.toLowerCase()==='r')reveal();if(e.key==='ArrowLeft')prev();if(e.key==='ArrowRight')next()});
render();
</script>
</body>
</html>
