<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>IQ LIVE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;overflow:hidden}.stage{--y:#ffd21f;--g:#38e889;--r:#ff3b52;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% -5%,#252a45,#0c111d 35%,#030507 72%)}.shell{width:100%;height:100%;max-width:1920px;margin:auto;padding:18px;display:grid;grid-template-rows:auto 1fr;gap:12px}.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}.brand{font-size:clamp(20px,2.2vw,42px);font-weight:1000}.brand span{color:var(--y)}.live{display:flex;align-items:center;gap:7px;background:#ed1839;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:1000}.live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:b 1s infinite}.stats{display:flex;justify-content:flex-end;gap:8px}.pill{border:1px solid #313a4d;background:#0b1019cc;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900}.progress{height:7px;border-radius:20px;background:#1a202d;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#28d7ff,var(--y));transition:width .25s linear}.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,22%);gap:12px}.game{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr auto;gap:10px}.headline{text-align:center}.eyebrow{font-size:11px;font-weight:1000;letter-spacing:.2em;color:#8490a6}.headline h1{font-size:clamp(28px,4vw,68px);line-height:.95;margin:6px 0 5px;font-weight:1000}.instruction{display:inline-flex;background:var(--y);color:#050505;padding:7px 17px;border-radius:999px;font-weight:1000;font-size:clamp(11px,1vw,16px)}.board{min-height:0;position:relative;border:2px solid #343c4d;border-radius:24px;background:linear-gradient(145deg,#111827f5,#080c14f7);padding:clamp(16px,2.3vw,42px);display:flex;flex-direction:column;justify-content:center;overflow:hidden}.question{text-align:center;font-weight:1000;font-size:clamp(28px,4vw,72px);line-height:1.13;letter-spacing:-.04em;margin:auto 0}.accent{color:var(--y)}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:clamp(18px,2.5vw,38px)}.choice{border:2px solid #303a4c;background:#111827;border-radius:16px;padding:12px 8px;color:#fff;font-size:clamp(16px,1.8vw,30px);font-weight:1000;cursor:pointer}.choice b{display:block;font-size:10px;color:#8590a6;margin-bottom:2px}.choice.correct{background:#0b3826;border-color:var(--g)}.timerrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;margin-top:16px}.round,.difficulty{font-size:11px;color:#8a95a9;font-weight:900}.difficulty{text-align:right}.difficulty b{color:var(--g)}.timer{text-align:center;font-size:clamp(48px,6vw,92px);font-weight:1000;line-height:.8;min-width:145px;font-variant-numeric:tabular-nums}.timer small{display:block;font-size:9px;letter-spacing:.18em;color:#7f899d;margin-top:10px}.timer.hot{color:var(--r);animation:p .55s infinite}.answer{position:absolute;inset:0;z-index:5;display:grid;place-items:center;text-align:center;background:#050b08ef;backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:.2s}.answer.show{opacity:1}.answer .box{border:2px solid var(--g);background:#0b2018;border-radius:24px;padding:25px 40px}.answer .label{font-size:12px;color:#87a494;font-weight:1000;letter-spacing:.2em}.answer .value{font-size:clamp(54px,8vw,130px);line-height:1;font-weight:1000;color:var(--g);margin:7px 0}.answer .sub{font-size:13px;color:#c8d2cc;font-weight:800}.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;border:1px solid #2b3444;border-radius:14px;background:#080c14dd;padding:9px 12px;font-size:11px;font-weight:900;color:#8c97aa}.bottom strong{color:#fff}.bottom .center{text-align:center;color:var(--y)}.bottom .right{text-align:right}.side{min-height:0;display:grid;grid-template-rows:auto 1fr auto;gap:10px}.panel{border:1px solid #2c3547;border-radius:18px;background:#080d16e8;overflow:hidden}.panelhead{display:flex;justify-content:space-between;padding:11px 13px;border-bottom:1px solid #252e3e;font-size:11px;font-weight:1000}.panelhead span:last-child{color:#7f8a9f}.chat{padding:8px 11px;overflow:hidden}.msg{display:flex;gap:7px;padding:6px 2px;font-size:12px}.avatar{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:grid;place-items:center;background:#20293a}.msg b{color:#8fdfff}.ok{color:var(--g)}.vote{padding:10px 12px}.voteitem{display:grid;grid-template-columns:34px 1fr 42px;gap:8px;align-items:center;margin:9px 0;font-size:11px;font-weight:900}.bar{height:9px;border-radius:20px;background:#1c2432;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#5e6c82}.voteitem:first-child .bar i{background:var(--g)}.leaderlist{padding:7px 11px 11px}.leaderrow{display:grid;grid-template-columns:22px 1fr auto;gap:7px;padding:6px 0;border-bottom:1px solid #1b2330;font-size:11px}.leaderrow strong{color:var(--y)}.tools{display:flex;gap:7px;padding:9px}.tool{flex:1;border:1px solid #293345;background:#0d1420;border-radius:11px;padding:8px 4px;text-align:center;font-size:9px;font-weight:1000;color:#9da8bb}.tool b{display:block;color:#fff;font-size:14px;margin-bottom:2px}.settings{position:fixed;top:12px;right:12px;z-index:30;display:flex;gap:6px}.iconbtn{width:40px;height:40px;border:1px solid #30394a;background:#090e17;color:#fff;border-radius:11px;font-size:20px;display:grid;place-items:center;cursor:pointer}.iconbtn.on{color:var(--y);border-color:#665a21}.iconbtn:active{transform:scale(.94)}@keyframes b{50%{opacity:.25}}@keyframes p{50%{transform:scale(1.08)}}
@media(max-width:900px){.shell{padding:10px;gap:8px}.topbar{grid-template-columns:1fr auto}.brand{font-size:22px}.stats{display:none}.main{grid-template-columns:1fr}.side{display:none}.board{border-radius:18px;padding:16px}.headline h1{font-size:30px}.choices{grid-template-columns:1fr 1fr}.timer{font-size:clamp(43px,11vw,76px)}.bottom{font-size:9px}.bottom .center{font-size:10px}}
@media(max-aspect-ratio:3/4){.shell{padding:12px 10px}.main{display:block}.game{height:100%;grid-template-rows:auto 1fr auto}.board{padding:15px 10px}.question{font-size:clamp(25px,8vw,48px)}.bottom{grid-template-columns:1fr 1fr}.bottom .center{display:none}.bottom .right{text-align:right}}
</style>
</head>
<body>
<div class="stage">
<div class="settings"><button class="iconbtn" id="musicBtn" aria-label="Study music" title="Study music">🎧</button><button class="iconbtn" id="fsBtn" aria-label="Fullscreen" title="Fullscreen">⛶</button></div>
<div class="shell">
<header><div class="topbar"><div class="brand">🧠 <span>IQ</span> LIVE</div><div class="live"><i></i> LIVE</div><div class="stats"><div class="pill">👁 <b id="viewers">1,284</b></div><div class="pill">🔥 <b id="streak">0</b></div></div></div><div class="progress"><i id="progress"></i></div></header>
<section class="main"><div class="game">
<div class="headline"><div class="eyebrow" id="category">MATH CHALLENGE</div><h1 id="title">BEAT THE CROWD</h1><div class="instruction">💬 COMMENT A, B, C OR D</div></div>
<div class="board"><div class="question" id="question">Loading…</div><div class="choices" id="choices"></div><div class="timerrow"><div class="round" id="round">TEST 1</div><div class="timer" id="timer">01:00<small>SECONDS LEFT</small></div><div class="difficulty">DIFFICULTY <b id="difficulty">EASY</b></div></div><div class="answer" id="answer"><div class="box"><div class="label">CORRECT ANSWER</div><div class="value" id="answerValue">36</div><div class="sub" id="answerSub">Next test in 5 seconds</div></div></div></div>
<div class="bottom"><div>🏆 <strong id="topPlayer">Waiting…</strong></div><div class="center">🎧 FOCUS • THINK • ANSWER</div><div class="right">NEXT: <strong id="next">01:00</strong></div></div>
</div>
<aside class="side"><div class="panel"><div class="panelhead"><span>💬 LIVE CHAT</span><span id="answers">0</span></div><div class="chat" id="chat"></div></div><div class="panel"><div class="panelhead"><span>📊 ANSWERS</span><span id="totalVotes">0</span></div><div class="vote" id="votes"></div><div class="panelhead"><span>🏆 LEADERBOARD</span></div><div class="leaderlist" id="leaders"></div></div><div class="panel tools"><div class="tool"><b>👍</b></div><div class="tool"><b>❤️</b></div><div class="tool"><b>🔥</b></div><div class="tool"><b>🏅</b></div></div></aside>
</section></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),LETTERS=['A','B','C','D'],ROUND_TIME=60;
const names=['Aarav','Pooja','Brainy','Neha','Math King','Ravi','Smarty','Legend','IQ Master','Quiz Boss'],emojis=['😎','🧠','🔥','⚡','🎯','👑','🤓','🚀','💎','🐯'];
let round=0,left=ROUND_TIME,locked=false,timerHandle,nextHandle,streak=0,totalAnswers=0,players={},votes=[0,0,0,0],q;
const generators=[
()=>{let a=2+~~(Math.random()*7),d=2+~~(Math.random()*5),v=[a,a+d,a+2*d,a+3*d],ans=a+4*d;return{cat:'NUMBER PATTERN',title:'WHAT COMES NEXT?',q:v.join('  •  ')+'  •  ?',ans,opts:[ans,ans-2,ans+3,ans+5],diff:'EASY'}},
()=>{let a=3+~~(Math.random()*7),b=2+~~(Math.random()*7),ans=a*b+a;return{cat:'MATH TRAP',title:'SOLVE THE MATH',q:`${a} × ${b} + ${a} = ?`,ans,opts:[ans,a*b,ans+2,a+b],diff:'EASY'}},
()=>{let a=3+~~(Math.random()*8),ans=a*a;return{cat:'SQUARE TEST',title:'NO CALCULATOR!',q:`${a} × ${a} = ?`,ans,opts:[ans,ans-1,ans+1,ans+4],diff:'EASY'}},
()=>{let a=2+~~(Math.random()*8),b=2+~~(Math.random()*7),c=2+~~(Math.random()*5),ans=(a+b)*c;return{cat:'LOGIC MATH',title:'CAN YOU SOLVE IT?',q:`(${a} + ${b}) × ${c} = ?`,ans,opts:[ans,ans+c,ans-c,a*b+c],diff:'MEDIUM'}},
()=>{let a=4+~~(Math.random()*8),ans=a*4;return{cat:'NUMBER LOGIC',title:'FIND THE RULE',q:`${a} → ${a*2} → ${a*3} → ?`,ans,opts:[ans,a*3,ans+2,a*5],diff:'MEDIUM'}},
()=>({cat:'ODD ONE OUT',title:'WHICH DOESN’T BELONG?',q:'APPLE  •  BANANA  •  CARROT  •  MANGO',ans:'CARROT',opts:['CARROT','APPLE','BANANA','MANGO'],diff:'EASY'}),
()=>({cat:'VISUAL IQ',title:'SPOT THE ODD ONE',q:'▲   ▲   ◆   ▲',ans:'◆',opts:['▲','◆','●','■'],diff:'MEDIUM'}),
()=>{let a=5+~~(Math.random()*6),b=2+~~(Math.random()*5),ans=a+b*2;return{cat:'BRAIN TEASER',title:'DON’T RUSH!',q:`${a} + ${b} × 2 = ?`,ans,opts:[ans,a+b,a*2+b,ans+2],diff:'MEDIUM'}}
];
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function makeQuestion(){q=generators[round%generators.length]();q.opts=shuffle(q.opts)}
function renderQuestion(){locked=false;left=ROUND_TIME;votes=[0,0,0,0];totalAnswers=0;makeQuestion();$('category').textContent=q.cat;$('title').textContent=q.title;$('difficulty').textContent=q.diff;$('round').textContent='TEST '+(round+1);$('answer').classList.remove('show');$('chat').innerHTML='';$('answers').textContent='0';$('totalVotes').textContent='0';$('question').innerHTML=q.q.replace(/(\d+|\?|×|→|\+|\(|\))/g,m=>`<span class="accent">${m}</span>`);$('choices').innerHTML=q.opts.map((v,i)=>`<button class="choice" data-value="${String(v)}"><b>${LETTERS[i]}</b>${v}</button>`).join('');updateVotes();addSystem('New puzzle 👇');tick()}
function tick(){$('timer').innerHTML=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}<small>SECONDS LEFT</small>`;$('timer').classList.toggle('hot',left<=10);$('progress').style.width=(left/ROUND_TIME*100)+'%';$('next').textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left<=0){reveal();return}clearTimeout(timerHandle);timerHandle=setTimeout(()=>{left--;tick()},1000)}
function reveal(){if(locked)return;locked=true;clearTimeout(timerHandle);let els=[...document.querySelectorAll('.choice')],good=els.find(x=>x.dataset.value===String(q.ans));if(good)good.classList.add('correct');let letter=good?good.querySelector('b').textContent:'?';let pct=totalAnswers?Math.round(votes[els.indexOf(good)]/totalAnswers*100):0;$('answerValue').textContent=q.ans;$('answerSub').textContent=`${pct}% chose ${letter} • Next test in 5 seconds`;$('answer').classList.add('show');nextHandle=setTimeout(()=>{round++;renderQuestion()},5000)}
function cast(name,letter){if(locked||!LETTERS.includes(letter))return;let i=LETTERS.indexOf(letter);votes[i]++;totalAnswers++;$('answers').textContent=totalAnswers;$('totalVotes').textContent=totalAnswers;updateVotes();let els=[...document.querySelectorAll('.choice')],ok=els[i]&&els[i].dataset.value===String(q.ans);players[name]=(players[name]||0)+(ok?10:0);streak=ok?streak+1:0;$('streak').textContent=streak;addChat(name,letter,ok);renderLeaders()}
function updateVotes(){let total=Math.max(1,totalAnswers);$('votes').innerHTML=votes.map((n,i)=>`<div class="voteitem"><b>${LETTERS[i]}</b><div class="bar"><i style="width:${Math.round(n/total*100)}%"></i></div><span>${Math.round(n/total*100)}%</span></div>`).join('')}
function addChat(name,text,ok){let e=document.createElement('div');e.className='msg';e.innerHTML=`<span class="avatar">${emojis[Math.floor(Math.random()*emojis.length)]}</span><span><b>${name}</b>: ${text} ${ok?'<span class="ok">✓</span>':''}</span>`;$('chat').prepend(e);while($('chat').children.length>8)$('chat').lastChild.remove()}
function addSystem(text){let e=document.createElement('div');e.className='msg';e.innerHTML=`<span class="avatar">🧠</span><span>${text}</span>`;$('chat').appendChild(e)}
function renderLeaders(){let top=Object.entries(players).sort((a,b)=>b[1]-a[1]).slice(0,5);$('leaders').innerHTML=(top.length?top:[['Waiting…',0]]).map((p,i)=>`<div class="leaderrow"><span>${['🥇','🥈','🥉','4','5'][i]}</span><span>${p[0]}</span><strong>${p[1]}</strong></div>`).join('');if(top[0])$('topPlayer').textContent=top[0][0]+' • '+top[0][1]}
$('choices').addEventListener('click',e=>{let b=e.target.closest('.choice');if(b)cast('You',LETTERS[[...document.querySelectorAll('.choice')].indexOf(b)])});
window.addEventListener('message',e=>{let d=e.data||{};if(d.type==='chat')cast(d.author||'Viewer',String(d.text||'').trim().toUpperCase().charAt(0));if(d.type==='viewerCount'&&Number.isFinite(+d.value))$('viewers').textContent=(+d.value).toLocaleString()});
setInterval(()=>{if(!locked){let l=LETTERS[~~(Math.random()*4)],n=names[~~(Math.random()*names.length)];cast(n,l)}},1400);setInterval(()=>{$('viewers').textContent=(1250+~~(Math.random()*110)).toLocaleString()},5000);
$('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();

/* Real browser-generated ambient study music. It starts from the icon click or the first user interaction, avoiding autoplay blocking. */
let audioCtx=null,musicGain=null,musicTimer=null,musicOn=false;
function startMusic(){if(musicOn)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();musicGain=audioCtx.createGain();musicGain.gain.value=.045;musicGain.connect(audioCtx.destination);musicOn=true;$('musicBtn').textContent='🔊';$('musicBtn').classList.add('on');playPad();musicTimer=setInterval(playPad,8000)}
function playPad(){if(!audioCtx||!musicOn)return;const now=audioCtx.currentTime,notes=[261.63,329.63,392,493.88];notes.forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f*(i%2?.5:1);g.gain.setValueAtTime(.0001,now);g.gain.linearRampToValueAtTime(.018,now+1.5);g.gain.linearRampToValueAtTime(.0001,now+7.5);o.connect(g);g.connect(musicGain);o.start(now);o.stop(now+8)});let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=130.81;g.gain.setValueAtTime(.0001,now);g.gain.linearRampToValueAtTime(.008,now+2);g.gain.linearRampToValueAtTime(.0001,now+7.5);o.connect(g);g.connect(musicGain);o.start(now);o.stop(now+8)}
function stopMusic(){if(!musicOn)return;musicOn=false;clearInterval(musicTimer);if(musicGain){musicGain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.4);setTimeout(()=>{try{musicGain.disconnect()}catch(e){}},500)}$('musicBtn').textContent='🎧';$('musicBtn').classList.remove('on')}
$('musicBtn').onclick=()=>musicOn?stopMusic():startMusic();
// Try to unlock audio on a normal user gesture; browsers may still require the music icon tap.
document.addEventListener('pointerdown',()=>{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()},{once:false});
renderLeaders();renderQuestion();
</script>
</body>
</html>
