<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IQ LIVE — Chat Challenge</title><style>*{box-sizing:border-box}body{margin:0;background:#02040a;color:#fff;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;height:100vh;overflow:hidden}.stage{width:min(100vw,56.25vh);height:min(177.78vw,100vh);background:radial-gradient(circle at 50% 10%,#292061,#080b18 48%,#020307);overflow:hidden}.wrap{height:100%;padding:26px 19px;display:flex;flex-direction:column;gap:12px}.top,.leader,.chatHead{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:1000;letter-spacing:.1em}.live{background:#ff174d;padding:7px 10px;border-radius:20px;font-size:10px;font-weight:1000}.round{color:#9da6c0;font-size:10px;margin-left:7px}.bar{height:7px;background:#20253d;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c4dff,#00e5ff);transform-origin:left}.hero{text-align:center}.type{font-size:9px;letter-spacing:.18em;color:#8f9abc;font-weight:900}.hero h1{font-size:clamp(25px,6.8vw,47px);line-height:1;margin:7px 0}.command{font-size:clamp(14px,3.8vw,21px);font-weight:1000}.card{background:#0d1428f5;border:1px solid #303958;border-radius:24px;padding:17px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;box-shadow:0 20px 80px #0008}.puzzle{text-align:center;font-size:clamp(23px,6vw,42px);font-weight:1000;line-height:1.22}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:2px solid #303a5b;background:#151c32;border-radius:16px;padding:12px 7px;text-align:center;font-size:clamp(18px,4.7vw,27px);font-weight:950}.choice b{display:block;color:#8d98ba;font-size:10px;margin-bottom:2px}.timer{text-align:center;font-size:clamp(43px,11vw,76px);font-weight:1000;line-height:.85}.timer small{display:block;font-size:9px;letter-spacing:.17em;color:#8d98ba;margin-top:7px}.chat{background:#090f20;border:1px solid #28324e;border-radius:17px;padding:10px 11px}.chatHead{font-size:9px;color:#8d98ba;font-weight:900}.messages{height:48px;overflow:hidden;font-size:11px}.msg{padding-top:4px}.msg strong{color:#9d8cff}.answer{display:none;text-align:center;border-radius:17px;padding:12px;background:#0b281e;border:1px solid #29dc8a}.answer.show{display:block}.big{font-size:25px;font-weight:1000;color:#48f09b}.leader{font-size:10px;color:#8993b1}.leader strong{color:#ffd54a}.foot{text-align:center;font-size:9px;color:#717b98}.pulse{animation:p 1s infinite}@keyframes p{50%{transform:scale(1.08)}}
</style></head><body><main class="stage"><div class="wrap"><div class="top"><div class="logo">🧠 IQ LIVE</div><div><span class="live">● LIVE</span><span class="round" id="round">ROUND 001</span></div></div><div class="bar"><i id="progress"></i></div><div class="hero"><div class="type" id="type">CHAT CHALLENGE</div><h1 id="title">BEAT THE CROWD</h1><div class="command">💬 COMMENT A, B, C OR D</div></div><div class="card"><div class="puzzle" id="puzzle">Loading…</div><div class="choices" id="choices"></div><div class="timer" id="timer">10<small>SECONDS LEFT</small></div><div class="answer" id="answer"></div></div><div class="chat"><div class="chatHead"><span>💬 LIVE CHAT</span><span id="votes">0 ANSWERS</span></div><div class="messages" id="messages"><div class="msg">Type A, B, C or D in YouTube chat 👇</div></div></div><div class="leader"><span>🏆 TOP PLAYER</span><strong id="leader">Waiting for chat…</strong></div><div class="foot">Fastest correct answers score • Keep your streak alive • New puzzle every round</div></div></main><script>
const generators=[
()=>{let a=2+~~(Math.random()*8),d=2+~~(Math.random()*5),v=[a,a+d,a+2*d,a+3*d],ans=a+4*d;return ['NUMBER PATTERN','What comes next?',v.join(' • ')+' • ?',ans]},
()=>{let a=3+~~(Math.random()*7),b=2+~~(Math.random()*6),ans=a*b+a;return ['MATH TRAP',`Solve ${a} × ${b} + ${a}`,`${a} × ${b} + ${a} = ?`,ans]},
()=>{let n=4,s=Array.from({length:n},()=>1+~~(Math.random()*9)),ans=s[3];return ['MEMORY','Remember the final digit',s.join('  ')+'  →  ?',ans]},
()=>['WORD LOGIC','Which does NOT belong?','APPLE  •  BANANA  •  CARROT  •  MANGO','CARROT'],
()=>['ODD ONE OUT','Pick the odd symbol','▲   ▲   ◆   ▲','◆'],
()=>{let a=2+~~(Math.random()*9),ans=a*a;return ['SQUARE TEST',`What is ${a}²?`,`${a} × ${a} = ?`,ans]}
];
let round=0,q=null,left=10,locked=false,votes=0,players={};const $=id=>document.getElementById(id);function makeChoices(ans){let ds=typeof ans==='number'?[ans+1,Math.max(1,ans-1),ans+2]:['APPLE','BANANA','MANGO'];return [ans,...ds].sort(()=>Math.random()-.5)}function render(){locked=false;votes=0;$('votes').textContent='0 ANSWERS';$('answer').className='answer';q=generators[round%generators.length]();$('type').textContent=q[0];$('title').textContent=q[1];$('puzzle').textContent=q[2];$('round').textContent='ROUND '+String(round+1).padStart(3,'0');$('messages').innerHTML='<div class="msg">Type A, B, C or D in YouTube chat 👇</div>';$('choices').innerHTML='';makeChoices(q[3]).forEach((v,i)=>{let b=document.createElement('div');b.className='choice';b.dataset.value=String(v);b.innerHTML=`<b>${'ABCD'[i]}</b>${v}`;$('choices').appendChild(b)});left=10;tick()}function tick(){clearTimeout(window.t);$('timer').innerHTML=Math.max(0,left)+'<small>SECONDS LEFT</small>';$('timer').classList.toggle('pulse',left<=3);$('progress').style.transform=`scaleX(${left/10})`;if(left<=0)return reveal();window.t=setTimeout(()=>{left--;tick()},1000)}function reveal(){if(locked)return;locked=true;clearTimeout(window.t);let correctEl=[...document.querySelectorAll('.choice')].find(x=>x.dataset.value===String(q[3]));let letter=correctEl?correctEl.querySelector('b').textContent:'?';$('answer').className='answer show';$('answer').innerHTML=`<div class="big">ANSWER: ${letter} — ${q[3]}</div><div>🎯 Next round in 3 seconds</div>`;setTimeout(()=>{round++;render()},3000)}function chat(name,text){if(locked)return;let letter=text.trim().toUpperCase().charAt(0);if(!'ABCD'.includes(letter))return;votes++;$('votes').textContent=votes+' ANSWERS';let els=[...document.querySelectorAll('.choice')],el=els['ABCD'.indexOf(letter)];let correct=el&&el.dataset.value===String(q[3]);if(correct){players[name]=(players[name]||0)+1;let best=Object.entries(players).sort((a,b)=>b[1]-a[1])[0];$('leader').textContent=best[0]+' • '+best[1]+' pts'}let row=document.createElement('div');row.className='msg';row.innerHTML=`<strong>${name}</strong>: ${letter} ${correct?'🔥 CORRECT!':'locked in'}`;$('messages').prepend(row)}window.addEventListener('message',e=>{if(e.data?.type==='chat')chat(e.data.author||'Viewer',e.data.text||'')});render();
</script></body></html>
