<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070d"><title>IQ LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif}body{display:grid;place-items:center;overflow:hidden}.stage{--y:#ffd21f;--g:#38e889;--r:#ff3b52;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% -5%,#252a45,#0c111d 35%,#030507 72%)}.shell{width:100%;height:100%;max-width:1920px;margin:auto;padding:18px;display:grid;grid-template-rows:auto 1fr;gap:12px}.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}.brand{font-size:clamp(20px,2.2vw,42px);font-weight:1000}.brand span{color:var(--y)}.live{display:flex;align-items:center;gap:7px;background:#ed1839;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:1000}.live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:b 1s infinite}.stats{display:flex;justify-content:flex-end;gap:8px}.pill{border:1px solid #313a4d;background:#0b1019cc;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900}.progress{height:7px;border-radius:20px;background:#1a202d;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#28d7ff,var(--y));transition:width .25s linear}.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,22%);gap:12px}.game{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr auto;gap:10px}.headline{text-align:center}.eyebrow{font-size:11px;font-weight:1000;letter-spacing:.2em;color:#8490a6}.headline h1{font-size:clamp(28px,4vw,68px);line-height:.95;margin:6px 0 5px;font-weight:1000}.instruction{display:inline-flex;background:var(--y);color:#050505;padding:7px 17px;border-radius:999px;font-weight:1000;font-size:clamp(11px,1vw,16px)}.board{min-height:0;position:relative;border:2px solid #343c4d;border-radius:24px;background:linear-gradient(145deg,#111827f5,#080c14f7);padding:clamp(16px,2.3vw,42px);display:flex;flex-direction:column;justify-content:center;overflow:hidden}.question{text-align:center;font-weight:1000;font-size:clamp(28px,4vw,72px);line-height:1.13;letter-spacing:-.04em;margin:auto 0}.accent{color:var(--y)}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:clamp(18px,2.5vw,38px)}.choice{border:2px solid #303a4c;background:#111827;border-radius:16px;padding:12px 8px;color:#fff;font-size:clamp(16px,1.8vw,30px);font-weight:1000;cursor:pointer}.choice b{display:block;font-size:10px;color:#8590a6;margin-bottom:2px}.choice.correct{background:#0b3826;border-color:var(--g)}.choice.wrong{background:#40121a;border-color:var(--r)}.timerrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;margin-top:16px}.round,.difficulty{font-size:11px;color:#8a95a9;font-weight:900}.difficulty{text-align:right}.difficulty b{color:var(--g)}.timer{text-align:center;font-size:clamp(48px,6vw,92px);font-weight:1000;line-height:.8;min-width:145px;font-variant-numeric:tabular-nums}.timer small{display:block;font-size:9px;letter-spacing:.18em;color:#7f899d;margin-top:10px}.timer.hot{color:var(--r);animation:p .55s infinite}.answer{position:absolute;inset:0;z-index:5;display:grid;place-items:center;text-align:center;background:#050b08ef;backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:.2s}.answer.show{opacity:1}.answer .box{border:2px solid var(--g);background:#0b2018;border-radius:24px;padding:25px 40px}.answer .label{font-size:12px;color:#87a494;font-weight:1000;letter-spacing:.2em}.answer .value{font-size:clamp(54px,8vw,130px);line-height:1;font-weight:1000;color:var(--g);margin:7px 0}.answer .sub{font-size:13px;color:#c8d2cc;font-weight:800}.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;border:1px solid #2b3444;border-radius:14px;background:#080c14dd;padding:9px 12px;font-size:11px;font-weight:900;color:#8c97aa}.bottom strong{color:#fff}.bottom .center{text-align:center;color:var(--y)}.bottom .right{text-align:right}.side{min-height:0;display:grid;grid-template-rows:auto 1fr auto;gap:10px}.panel{border:1px solid #2c3547;border-radius:18px;background:#080d16e8;overflow:hidden}.panelhead{display:flex;justify-content:space-between;padding:11px 13px;border-bottom:1px solid #252e3e;font-size:11px;font-weight:1000}.panelhead span:last-child{color:#7f8a9f}.chat{padding:8px 11px;overflow:hidden}.msg{display:flex;gap:7px;padding:6px 2px;font-size:12px}.avatar{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:grid;place-items:center;background:#20293a}.msg b{color:#8fdfff}.ok{color:var(--g)}.vote{padding:10px 12px}.voteitem{display:grid;grid-template-columns:34px 1fr 42px;gap:8px;align-items:center;margin:9px 0;font-size:11px;font-weight:900}.bar{height:9px;border-radius:20px;background:#1c2432;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#5e6c82}.voteitem:first-child .bar i{background:var(--g)}.leaderlist{padding:7px 11px 11px}.leaderrow{display:grid;grid-template-columns:22px 1fr auto;gap:7px;padding:6px 0;border-bottom:1px solid #1b2330;font-size:11px}.leaderrow strong{color:var(--y)}.tools{display:flex;gap:7px;padding:9px}.tool{flex:1;border:1px solid #293345;background:#0d1420;border-radius:11px;padding:8px 4px;text-align:center;font-size:9px;font-weight:1000;color:#9da8bb}.tool b{display:block;color:#fff;font-size:14px}.settings{position:fixed;top:12px;right:12px;z-index:30;display:flex;gap:6px}.iconbtn{width:40px;height:40px;border:1px solid #30394a;background:#090e17;color:#fff;border-radius:11px;font-size:20px;display:grid;place-items:center;cursor:pointer}.iconbtn.on{color:var(--y);border-color:#665a21}.iconbtn:active{transform:scale(.94)}@keyframes b{50%{opacity:.25}}@keyframes p{50%{transform:scale(1.08)}}@media(max-width:900px){.shell{padding:10px;gap:8px}.topbar{grid-template-columns:1fr auto}.brand{font-size:22px}.stats{display:none}.main{grid-template-columns:1fr}.side{display:none}.board{border-radius:18px;padding:16px}.headline h1{font-size:30px}.choices{grid-template-columns:1fr 1fr}.timer{font-size:clamp(43px,11vw,76px)}.bottom{font-size:9px}.bottom .center{font-size:10px}}@media(max-aspect-ratio:3/4){.shell{padding:12px 10px}.main{display:block}.game{height:100%;grid-template-rows:auto 1fr auto}.board{padding:15px 10px}.question{font-size:clamp(25px,8vw,48px)}.bottom{grid-template-columns:1fr 1fr}.bottom .center{display:none}.bottom .right{text-align:right}}</style></head><body><div class="stage"><div class="settings"><button class="iconbtn" id="musicBtn" aria-label="Music">🎧</button><button class="iconbtn" id="fsBtn">⛶</button></div><div class="shell"><header><div class="topbar"><div class="brand">🧠 <span>IQ</span> LIVE</div><div class="live"><i></i> LIVE</div><div class="stats"><div class="pill">👁 <b id="viewers">1,284</b></div><div class="pill">🔥 <b id="streak">0</b></div></div></div><div class="progress"><i id="progress"></i></div></header><section class="main"><div class="game"><div class="headline"><div class="eyebrow" id="category"></div><h1 id="title"></h1><div class="instruction">💬 COMMENT A, B, C OR D</div></div><div class="board"><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="timerrow"><div class="round" id="round">TEST 1</div><div class="timer" id="timer">01:00<small>SECONDS LEFT</small></div><div class="difficulty">DIFFICULTY <b id="difficulty">EASY</b></div></div><div class="answer" id="answer"><div class="box"><div class="label">CORRECT ANSWER</div><div class="value" id="answerValue"></div><div class="sub" id="answerSub"></div></div></div></div><div class="bottom"><div>🏆 <strong id="topPlayer">Waiting…</strong></div><div class="center">🎧 FOCUS • THINK • ANSWER</div><div class="right">NEXT: <strong id="next">01:00</strong></div></div></div><aside class="side"><div class="panel"><div class="panelhead"><span>💬 LIVE CHAT</span><span id="answers">0</span></div><div class="chat" id="chat"></div></div><div class="panel"><div class="panelhead"><span>📊 ANSWERS</span><span id="totalVotes">0</span></div><div class="vote" id="votes"></div><div class="panelhead"><span>🏆 LEADERBOARD</span></div><div class="leaderlist" id="leaders"></div></div><div class="panel tools"><div class="tool"><b>👍</b></div><div class="tool"><b>❤️</b></div><div class="tool"><b>🔥</b></div><div class="tool"><b>🏅</b></div></div></aside></section></div></div><script>
'use strict';const $=id=>document.getElementById(id),L=['A','B','C','D'],T=60;let round=0,left=T,locked=false,timerHandle,nextHandle,streak=0,total=0,players={},votes=[0,0,0,0],q;const names=['Aarav','Pooja','Brainy','Neha','Math King','Ravi','Smarty','Legend','IQ Master','Quiz Boss'],emo=['😎','🧠','🔥','⚡','🎯','👑','🤓','🚀','💎','🐯'];
const gens=[()=>{let a=2+~~(Math.random()*7),d=2+~~(Math.random()*5),v=[a,a+d,a+2*d,a+3*d],x=a+4*d;return{cat:'NUMBER PATTERN',title:'WHAT COMES NEXT?',q:v.join('  •  ')+'  •  ?',ans:x,o:[x,x-2,x+3,x+5],dif:'EASY'}},()=>{let a=3+~~(Math.random()*7),b=2+~~(Math.random()*7),x=a*b+a;return{cat:'MATH TRAP',title:'SOLVE THE MATH',q:`${a} × ${b} + ${a} = ?`,ans:x,o:[x,a*b,x+2,a+b],dif:'EASY'}},()=>{let a=3+~~(Math.random()*8),x=a*a;return{cat:'SQUARE TEST',title:'NO CALCULATOR!',q:`${a} × ${a} = ?`,ans:x,o:[x,x-1,x+1,x+4],dif:'EASY'}},()=>{let a=2+~~(Math.random()*8),b=2+~~(Math.random()*7),c=2+~~(Math.random()*5),x=(a+b)*c;return{cat:'LOGIC MATH',title:'CAN YOU SOLVE IT?',q:`(${a} + ${b}) × ${c} = ?`,ans:x,o:[x,x+c,x-c,a*b+c],dif:'MEDIUM'}},()=>{let a=4+~~(Math.random()*8),x=a*4;return{cat:'NUMBER LOGIC',title:'FIND THE RULE',q:`${a} → ${a*2} → ${a*3} → ?`,ans:x,o:[x,a*3,x+2,a*5],dif:'MEDIUM'}},()=>({cat:'ODD ONE OUT',title:'WHICH DOESN’T BELONG?',q:'APPLE  •  BANANA  •  CARROT  •  MANGO',ans:'CARROT',o:['CARROT','APPLE','BANANA','MANGO'],dif:'EASY'}),()=>({cat:'VISUAL IQ',title:'SPOT THE ODD ONE',q:'▲   ▲   ◆   ▲',ans:'◆',o:['▲','◆','●','■'],dif:'MEDIUM'}),()=>{let a=5+~~(Math.random()*6),b=2+~~(Math.random()*5),x=a+b*2;return{cat:'BRAIN TEASER',title:'DON’T RUSH!',q:`${a} + ${b} × 2 = ?`,ans:x,o:[x,a+b,a*2+b,x+2],dif:'MEDIUM'}}];
const sh=a=>[...a].sort(()=>Math.random()-.5);function beep(freq=700,dur=.09,vol=.045){if(!audio.ctx)return;let o=audio.ctx.createOscillator(),g=audio.ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.ctx.currentTime);g.gain.exponentialRampToValueAtTime(vol,audio.ctx.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,audio.ctx.currentTime+dur);o.connect(g);g.connect(audio.fx);o.start();o.stop(audio.ctx.currentTime+dur+.02)}
const audio={ctx:null,master:null,fx:null,music:null,on:false,next:0,notes:[261.63,329.63,392,329.63,293.66,349.23,440,349.23]};function startAudio(){if(!audio.ctx){let C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio.ctx=new C;audio.master=audio.ctx.createGain();audio.fx=audio.ctx.createGain();audio.music=audio.ctx.createGain();audio.master.gain.value=.55;audio.fx.gain.value=.55;audio.music.gain.value=.10;audio.fx.connect(audio.master);audio.music.connect(audio.master);audio.master.connect(audio.ctx.destination)}if(audio.ctx.state==='suspended')audio.ctx.resume();audio.on=true;musicLoop();$('musicBtn').textContent='🔊';$('musicBtn').classList.add('on');beep(660,.12,.06)}
function stopAudio(){audio.on=false;if(audio.ctx){audio.music.gain.cancelScheduledValues(audio.ctx.currentTime);audio.music.gain.setTargetAtTime(.0001,audio.ctx.currentTime,.04)}$('musicBtn').textContent='🎧';$('musicBtn').classList.remove('on')}
function musicLoop(){if(!audio.on||!audio.ctx)return;let now=audio.ctx.currentTime;if(now<audio.next){}else{let n=audio.notes[Math.floor((audio.next/0.9)%audio.notes.length)],o=audio.ctx.createOscillator(),g=audio.ctx.createGain();o.type='triangle';o.frequency.value=n;g.gain.setValueAtTime(.0001,now);g.gain.linearRampToValueAtTime(.35,now+.08);g.gain.exponentialRampToValueAtTime(.0001,now+.82);o.connect(g);g.connect(audio.music);o.start(now);o.stop(now+.85);audio.next=now+.9}requestAnimationFrame(musicLoop)}
function question(){q=gens[round%gens.length]();q.o=sh(q.o);$('category').textContent=q.cat;$('title').textContent=q.title;$('difficulty').textContent=q.dif;$('round').textContent='TEST '+(round+1);$('question').innerHTML=q.q.replace(/(\d+|\?|×|→|\+|\(|\))/g,m=>`<span class="accent">${m}</span>`);$('choices').innerHTML=q.o.map((x,i)=>`<button class="choice" data-v="${x}"><b>${L[i]}</b>${x}</button>`).join('');$('answer').classList.remove('show');$('chat').innerHTML='';votes=[0,0,0,0];total=0;updateVotes();addSystem('New puzzle 👇');left=T;locked=false;tick()}
function tick(){let m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');$('timer').innerHTML=`${m}:${s}<small>SECONDS LEFT</small>`;$('timer').classList.toggle('hot',left<=10);$('progress').style.width=left/T*100+'%';$('next').textContent=`${m}:${s}`;if(left>0){if(audio.on&&left<=10)beep(left===10?500:820,.07,.035);timerHandle=setTimeout(()=>{left--;tick()},1000)}else reveal()}
function reveal(){if(locked)return;locked=true;clearTimeout(timerHandle);let els=[...document.querySelectorAll('.choice')],good=els.find(x=>String(x.dataset.v)===String(q.ans));if(good)good.classList.add('correct');let i=good?els.indexOf(good):0,p=total?Math.round(votes[i]/total*100):0;$('answerValue').textContent=q.ans;$('answerSub').textContent=p+'% chose '+L[i];$('answer').classList.add('show');if(audio.on){beep(980,.16,.06);setTimeout(()=>beep(1240,.18,.05),180)}nextHandle=setTimeout(()=>{round++;question()},5000)}
function cast(name,letter){if(locked)return;let i=L.indexOf(letter);if(i<0)return;votes[i]++;total++;$('answers').textContent=total;$('totalVotes').textContent=total;updateVotes();let els=[...document.querySelectorAll('.choice')],ok=String(els[i].dataset.v)===String(q.ans);players[name]=(players[name]||0)+(ok?10:0);if(ok){streak++;addChat(name,letter,true);if(audio.on)beep(900,.07,.035)}else{streak=0;addChat(name,letter,false)}$('streak').textContent=streak;leaders()}
function updateVotes(){let n=Math.max(total,1);$('votes').innerHTML=votes.map((v,i)=>`<div class="voteitem"><b>${L[i]}</b><div class="bar"><i style="width:${v/n*100}%"></i></div><span>${Math.round(v/n*100)}%</span></div>`).join('')}
function addChat(n,t,ok){let e=document.createElement('div');e.className='msg';e.innerHTML=`<span class="avatar">${emo[Math.random()*emo.length|0]}</span><span><b>${esc(n)}</b>: ${t} ${ok?'<span class="ok">🔥</span>':''}</span>`;$('chat').prepend(e);while($('chat').children.length>8)$('chat').lastChild.remove()}function addSystem(t){let e=document.createElement('div');e.className='msg';e.innerHTML=`<span class="avatar">🧠</span><span>${t}</span>`;$('chat').append(e)}function leaders(){let a=Object.entries(players).sort((x,y)=>y[1]-x[1]).slice(0,5);$('leaders').innerHTML=(a.length?a:[['Waiting…',0]]).map((x,i)=>`<div class="leaderrow"><span>${['🥇','🥈','🥉','4','5'][i]}</span><span>${esc(x[0])}</span><strong>${x[1]}</strong></div>`).join('');if(a[0])$('topPlayer').textContent=a[0][0]+' • '+a[0][1]+' pts'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('choices').onclick=e=>{let b=e.target.closest('.choice');if(!b)return;cast('You',L[[...document.querySelectorAll('.choice')].indexOf(b)])};$('musicBtn').onclick=()=>audio.on?stopAudio():startAudio();$('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();window.addEventListener('pointerdown',()=>{if(audio.ctx&&audio.ctx.state==='suspended')audio.ctx.resume()},{passive:true});window.addEventListener('message',e=>{let d=e.data||{};if(d.type==='chat')cast(d.author||'Viewer',String(d.text||'').trim().toUpperCase()[0]);if(d.type==='viewerCount'&&isFinite(+d.value))$('viewers').textContent=(+d.value).toLocaleString()});setInterval(()=>{if(Math.random()<.7&&!locked)cast(names[Math.random()*names.length|0],L[Math.random()*4|0])},1800);setInterval(()=>{if(!document.hidden)$('viewers').textContent=(1250+Math.random()*150|0).toLocaleString()},5000);leaders();question();
</script></body></html>
