<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IQ LIVE — Chat Challenge</title><style>
*{box-sizing:border-box}body{margin:0;background:#03050b;color:#fff;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;height:100vh;overflow:hidden}.stage{width:min(100vw,56.25vh);height:min(177.78vw,100vh);background:radial-gradient(circle at 50% 15%,#24205d,#080b18 45%,#020308);position:relative;overflow:hidden}.wrap{height:100%;padding:28px 20px;display:flex;flex-direction:column;gap:13px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:1000;letter-spacing:.12em}.live{background:#ff174d;padding:7px 10px;border-radius:20px;font-size:11px;font-weight:900}.round{font-size:11px;color:#9ba4c0;margin-left:8px}.bar{height:7px;background:#202640;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c4dff,#00e5ff);transform-origin:left}.hero{text-align:center}.type{font-size:10px;letter-spacing:.18em;color:#8e9ac0;font-weight:900}.hero h1{font-size:clamp(27px,7vw,48px);line-height:1;margin:8px 0}.command{color:#fff;font-weight:900;font-size:clamp(15px,4vw,22px)}.card{background:rgba(12,17,34,.94);border:1px solid #303957;border-radius:25px;padding:18px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:15px;box-shadow:0 20px 80px #0008}.puzzle{text-align:center;font-size:clamp(24px,6vw,43px);font-weight:950;line-height:1.25}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:2px solid #303a5c;background:#151c33;border-radius:17px;padding:14px 8px;text-align:center;font-size:clamp(19px,5vw,29px);font-weight:950}.choice b{display:block;color:#8e9ac0;font-size:11px;margin-bottom:3px}.timer{text-align:center;font-size:clamp(45px,12vw,80px);font-weight:1000;line-height:.9}.timer small{display:block;font-size:10px;letter-spacing:.18em;color:#8e9ac0}.chat{background:#0b1020;border:1px solid #28314d;border-radius:18px;padding:11px 12px;min-height:78px}.chatHead{display:flex;justify-content:space-between;font-size:10px;color:#8e9ac0;font-weight:900}.messages{height:48px;overflow:hidden;font-size:12px}.msg{padding-top:4px}.msg strong{color:#9d8cff}.leader{display:flex;justify-content:space-between;align-items:center}.leader strong{color:#ffd54a}.answer{display:none;text-align:center;border-radius:18px;padding:13px;background:#0d251d;border:1px solid #2bd98b}.answer.show{display:block}.answer .big{font-size:28px;font-weight:1000;color:#48f09b}.foot{text-align:center;font-size:10px;color:#78829f}.pulse{animation:p 1s infinite}@keyframes p{50%{transform:scale(1.06)}}
</style></head><body><main class="stage"><div class="wrap"><div class="top"><div class="logo">🧠 IQ LIVE</div><div><span class="live">● LIVE</span><span class="round" id="round">ROUND 001</span></div></div><div class="bar"><i id="progress"></i></div><div class="hero"><div class="type" id="type">CHAT CHALLENGE</div><h1 id="title">BEAT THE CROWD</h1><div class="command">💬 COMMENT A, B, C OR D</div></div><div class="card"><div class="puzzle" id="puzzle">Loading…</div><div class="choices" id="choices"></div><div class="timer" id="timer">10<small>SECONDS LEFT</small></div><div class="answer" id="answer"></div></div><div class="chat"><div class="chatHead"><span>💬 LIVE CHAT</span><span id="votes">0 ANSWERS</span></div><div class="messages" id="messages"><div class="msg">Be the first to answer! 👇</div></div></div><div class="leader"><span>🏆 TOP PLAYER</span><strong id="leader">Waiting for chat…</strong></div><div class="foot">Answer faster • Build your streak • Climb the leaderboard</div></div></main><script>
const qs=[
()=>{let a=2+~~(Math.random()*8),d=2+~~(Math.random()*5),x=[a,a+d,a+2*d,a+3*d],ans=a+4*d;return ['NUMBER PATTERN','What comes next?',x.join('  •  ')+'  •  ?',ans]};
()=>{let a=3+~~(Math.random()*7),b=2+~~(Math.random()*6),ans=a*b+a;return ['MATH TRAP',`Solve ${a} × ${b} + ${a}`,`${a} × ${b} + ${a} = ?`,ans]};
()=>{let n=3+~~(Math.random()*4),s=Array.from({length:n},()=>1+~~(Math.random()*9)),ans=s.at(-1);return ['MEMORY','Remember the final digit',s.join('  ')+'  →  ?',ans]};
()=>['WORD LOGIC','Which does NOT belong?','APPLE  •  BANANA  •  CARROT  •  MANGO',2];
()=>['ODD ONE OUT','Pick the odd symbol','▲   ▲   ◆   ▲',3];
()=>{let a=1+~~(Math.random()*5),ans=a*a;return ['SQUARE TEST',`What is ${a}²?`,`${a} × ${a} = ?`,ans]};
];
let round=0,left=10,q,locked=false,votes=0,players={};const $=x=>document.getElementById(x);function opts(ans){let ar=[ans,ans+1,Math.max(1,ans-1),ans+2];return ar.sort(()=>Math.random()-.5)}function render(){locked=false;votes=0;$('votes').textContent='0 ANSWERS';$('answer').className='answer';q=qs[round%qs.length]();$('type').textContent=q[0];$('title').textContent=q[1];$('puzzle').textContent=q[2];$('round').textContent='ROUND '+String(round+1).padStart(3,'0');$('progress').style.transform='scaleX(1)';$('choices').innerHTML='';let ar=opts(q[3]);ar.forEach((v,i)=>{let b=document.createElement('div');b.className='choice';b.innerHTML=`<b>${'ABCD'[i]}</b>${v}`;$('choices').appendChild(b)});left=10;tick()};function tick(){clearInterval(window.t);$('timer').textContent=left+'\n';$('timer').innerHTML=left+'<small>SECONDS LEFT</small>';$('timer').classList.toggle('pulse',left<=3);$('progress').style.transform=`scaleX(${left/10})`;if(left<=0){reveal();return}window.t=setTimeout(()=>{left--;tick()},1000)}function reveal(){if(locked)return;locked=true;clearTimeout(window.t);$('answer').className='answer show';$('answer').innerHTML=`<div class="big">ANSWER: ${q[3]}</div><div>🎯 Next round in 3 seconds</div>`;setTimeout(()=>{round++;render()},3000)}function addChat(name,text){if(locked)return;let m=text.trim().toUpperCase(),letters='ABCD',ix=letters.indexOf(m.charAt(0));if(ix<0)return;votes++;$('votes').textContent=votes+' ANSWERS';let row=document.createElement('div');row.className='msg';row.innerHTML=`<strong>${name}</strong>: ${m.charAt(0)} — ${['A','B','C','D'][ix]}`;$('messages').prepend(row);if(!players[name])players[name]=0;if((ix===0?0:ix)===0)players[name]+=1;let best=Object.entries(players).sort((a,b)=>b[1]-a[1])[0];if(best)$('leader').textContent=best[0]+' • '+best[1]+' pts'}window.addEventListener('message',e=>{if(e.data?.type==='chat')addChat(e.data.author||'Viewer',e.data.text||'')});render();
</script></body></html>
